name: simpati_mobile
description: "SIMPATI - Presensi ASN Kabupaten Soppeng"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # HTTP & API
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.4

  # Location & Maps
  geolocator: ^13.0.2
  geocoding: ^3.0.0

  # Camera & Image
  camera: ^0.11.1
  image_picker: ^1.1.2

  # State Management
  provider: ^6.1.2

  # Notifications
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^18.0.1

  # UI
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.17
  lottie: ^3.3.1

  # Utils
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  file_picker: ^10.3.10
  local_auth: ^2.3.0
  google_mlkit_face_detection: ^0.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0A0E27"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/images/
